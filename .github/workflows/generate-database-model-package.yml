name: Publish Database models NuGet package

on:
  pull_request:
    paths:
      - 'db/init/**'
      - 'generator/**'

  push:
    branches:
      - main
    paths:
      - 'db/init/**'
      - 'generator/**'

jobs:
  build:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Generate EF Models
        run: |
          docker compose \
            -f docker/generator/compose.yml \
            run \
            --user "$(id -u):$(id -g)" \
            --abort-on-container-exit \
            --exit-code-from generator

      - name: Verify generated models are up to date
        run: |
          git add generator/src

          if ! git diff --cached \
              --ignore-all-space \
              --ignore-blank-lines \
              --quiet; then

            echo "Generated EF Core models are out of date"
            echo "Run the generator locally and commit the generated files"

            git diff --cached

            exit 1
          fi

      - name: Set package version
        run: |
          VERSION=1.0.${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Pack Database Models
        run: |
          dotnet pack \
            generator/src/DfE.EducationProviderRegistry.Data.DatabaseModels \
            -c Release \
            -o ./nupkg \
            /p:PackageVersion=${{ env.VERSION }}

      - name: Publish package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/Dfe-digital/index.json" \
            --skip-duplicate