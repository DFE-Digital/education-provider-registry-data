name: Publish Database models NuGet package


on:
  pull_request:
    paths:
      - 'db/init/**'
      - 'generator/**'

  push:
    branches:
      - main
    paths:
      - 'db/init/**'
      - 'generator/**'

# TODO separate generating model from publishing package
jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5

      - name: Build package
        env:
          VERSION: 1.0.${{ github.run_number }}
          
        run: |
          docker compose \
            -f docker/generator/compose.yml \
            up \
            --abort-on-container-exit \
            --exit-code-from generator

      - name: Publish package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/Dfe-digital/index.json" \
            --skip-duplicate
