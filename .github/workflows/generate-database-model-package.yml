name: Publish Database models NuGet package


on:
  pull_request:
    paths:
      - 'db/init/**'
      - 'generator/**'

  push:
    branches:
      - main
    paths:
      - 'db/init/**'
      - 'generator/**'

# TODO separate generating model from publishing package
jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CONNECTION_STRING: Host=localhost;Database=efcore;Username=postgres;Password=postgres
      DB_HOST: localhost
      DB_NAME: efcore
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
 
      - name: Generate EF Models
        run: |
          docker compose \
            -f docker/generator/compose.yml \
            run --rm generator

      - name: Set package version
        run: |
          VERSION=1.0.${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: NuGet Package Database Models
        run: |
          dotnet pack generator/src/DfE.EducationProviderRegistry.Data.DatabaseModels \
            -c Release \
            -o ./nupkg \
            /p:PackageVersion=${{ env.VERSION }}
        
      - name: Publish package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/Dfe-digital/index.json" \
            --skip-duplicate
