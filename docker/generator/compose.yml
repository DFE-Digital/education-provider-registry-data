services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: efcore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../db/init:/docker-entrypoint-initdb.d

  generator:
    build:
      context: ../..
      dockerfile: docker/generator/Dockerfile

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ../..:/repo

    environment:
      CONNECTION_STRING: Host=db;Database=efcore;Username=postgres;Password=postgres
      VERSION: ${VERSION:?VERSION env must be supplied}

    command:
      - sh
      - /repo/docker/generator/generate.sh
